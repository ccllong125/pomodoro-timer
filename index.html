<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#E4E5E0">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>莫蘭迪番茄鐘 | Calm Pomodoro</title>
  <!-- 引入 Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <div class="glass-panel">
      
      <header class="header">
        <h1>Pomodoro</h1>
        <p class="subtitle">Stay calm and focused</p>
      </header>

      <div class="mode-selector">
        <button id="btn-mode-work" class="mode-btn active">工作</button>
        <button id="btn-mode-break" class="mode-btn">休息</button>
      </div>

      <div class="timer-display">
        <svg class="progress-ring" width="240" height="240">
          <circle class="progress-ring__track" stroke-width="8" fill="transparent" r="110" cx="120" cy="120"/>
          <circle class="progress-ring__circle" stroke-width="8" fill="transparent" r="110" cx="120" cy="120"/>
        </svg>
        <div class="time-text" id="time-display">25:00</div>
      </div>

      <div class="controls">
        <button id="btn-start" class="control-btn primary">開始</button>
        <button id="btn-pause" class="control-btn secondary hidden">暫停</button>
        <button id="btn-reset" class="control-btn secondary">重設</button>
      </div>

      <div class="settings-section">
        <h2 class="settings-title">自訂時間 (分鐘)</h2>
        <div class="settings-inputs">
          <div class="input-group">
            <label for="input-work">工作</label>
            <input type="number" id="input-work" value="25" min="1" max="90">
          </div>
          <div class="input-group">
            <label for="input-break">休息</label>
            <input type="number" id="input-break" value="5" min="1" max="30">
          </div>
        </div>
      </div>

    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
